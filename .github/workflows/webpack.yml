name: Spectra Quality Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "app.js"
            "styles.css"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing."
              exit 1
            fi
          done

          echo "All required Spectra files are present."

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Check HTML entry point
        shell: bash
        run: |
          set -euo pipefail

          grep -qi '<!doctype html' index.html || {
            echo "::error file=index.html::Missing HTML5 doctype."
            exit 1
          }

          grep -qi 'styles.css' index.html || {
            echo "::error file=index.html::index.html does not reference styles.css."
            exit 1
          }

          grep -qi 'app.js' index.html || {
            echo "::error file=index.html::index.html does not reference app.js."
            exit 1
          }

          echo "HTML entry point references the expected application files."

      - name: Check referenced local files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys
          from urllib.parse import urlparse

          root = Path(".")
          html = Path("index.html").read_text(encoding="utf-8", errors="ignore")

          refs = re.findall(r'''(?:src|href)=["']([^"']+)["']''', html, flags=re.I)
          missing = []

          for ref in refs:
              ref = ref.strip()

              if not ref or ref.startswith(("#", "data:", "mailto:", "tel:", "javascript:")):
                  continue

              parsed = urlparse(ref)
              if parsed.scheme or parsed.netloc or ref.startswith("//"):
                  continue

              clean = parsed.path.lstrip("/")
              if not clean:
                  continue

              target = root / clean
              if not target.exists():
                  missing.append(ref)

          if missing:
              print("Missing local files referenced by index.html:")
              for item in sorted(set(missing)):
                  print(f" - {item}")
              sys.exit(1)

          print("All local files referenced by index.html exist.")
          PY

      - name: Quality check summary
        run: |
          echo "Spectra static web app validation passed."
